# Auto-release on push to main (same idea as liltr: bump VERSION, build, upload, chore commit).
# Skip commits whose message contains "chore" to avoid loops after the version bump push.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    if: ${{ !contains(github.event.head_commit.message, 'chore') }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync Sparkle SUFeedURL with this repo
        run: |
          FEED="https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL ${FEED}" Sources/Lofii/Info.plist

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # macOS 26 image ships Xcode 26.4 (stable) + 26.5 beta; pin stable for reproducible builds.
          xcode-version: "26.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Live2D Cubism Core
        env:
          CUBISM_NATIVE_SDK_URL: ${{ vars.CUBISM_NATIVE_SDK_URL }}
          CUBISM_NATIVE_SDK_SHA256: ${{ vars.CUBISM_NATIVE_SDK_SHA256 }}
        run: scripts/install_cubism_core.sh

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: scripts/code_sign.sh

      - name: Bump version
        id: ver
        run: |
          NEW="$(scripts/update_version.sh)"
          echo "version=$NEW" >>"$GITHUB_OUTPUT"

      - name: Build release DMG
        run: scripts/build_release.sh

      - name: Update Sparkle appcast
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/update_appcast.sh

      - name: Upload GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/lofii-${{ steps.ver.outputs.version }}-macos.dmg
          asset_name: lofii-${{ steps.ver.outputs.version }}-macos.dmg
          tag: v${{ steps.ver.outputs.version }}
          overwrite: true
          body: |
            ## macOS install note (Gatekeeper / quarantine)

            The DMG contains `lofii.app` and an Applications shortcut. Browser downloads are quarantined by macOS (`com.apple.quarantine`). Builds that are **not** Developer ID-signed and **notarized** may show a security warning on first open.

            Open the DMG and drag `lofii.app` to Applications. If macOS blocks first launch, remove quarantine from the installed app:

            ```bash
            xattr -dr com.apple.quarantine /Applications/lofii.app
            ```

            More detail: [README — Install](https://github.com/${{ github.repository }}/blob/main/README.md#install) · [SPARKLE.md (section 7)](https://github.com/${{ github.repository }}/blob/main/SPARKLE.md#7-gatekeeper-quarantine-and-downloads-without-notarization)

      - name: Commit version bump
        run: scripts/commit_release.sh

      - name: Remove CI signing keychain
        if: always()
        run: scripts/reset_code_sign.sh
